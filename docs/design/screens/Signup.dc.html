<div class="enter" style="display:flex;flex-direction:column;gap:6px"><h1 class="t-title1">Create your account</h1><p class="t-body" style="color:var(--ink-muted)">One account for your phone, laptop and browser.</p></div>
<button type="button" class="btn btn-secondary btn-lg btn-block enter enter-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"></path></svg>Continue with Google</button>
