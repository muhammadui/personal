<div class="enter" style="display:flex;align-items:center;justify-content:space-between"><h1 class="t-title1">Lists and folders</h1></div>

<div class="list"><a href="PhoneToday.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit"><span class="ldot" style="width:12px;height:12px;flex:0 0 12px;background:var(--ink-muted)"></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Inbox</span></span><span class="t-meta">4</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneToday.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit"><span class="ldot" style="width:12px;height:12px;flex:0 0 12px;background:var(--brand-blue)"></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Work</span></span><span class="t-meta">9</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneToday.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit"><span class="ldot" style="width:12px;height:12px;flex:0 0 12px;background:var(--brand-navy)"></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Home</span></span><span class="t-meta">5</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneToday.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit"><span class="ldot" style="width:12px;height:12px;flex:0 0 12px;background:var(--warn)"></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Shopping</span></span><span class="t-meta">3</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneToday.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit"><span class="ldot" style="width:12px;height:12px;flex:0 0 12px;background:var(--brand-lavender)"></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Personal</span></span><span class="t-meta">6</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a></div></section>
<section class="enter enter-2" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="t-label">Note folders</h2><button type="button" class="btn btn-ghost btn-sm" style="color:var(--text-accent)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New folder</button></div>
<div class="list"><a href="PhoneNotes.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit;padding-left:12px"><span style="color:var(--brand-blue);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Work</span></span><span class="t-meta">14</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneNotes.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit;padding-left:40px"><span style="color:#7C84EE;display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Meetings</span></span><span class="t-meta">6</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneNotes.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit;padding-left:12px"><span style="color:var(--brand-lavender);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Personal</span></span><span class="t-meta">11</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneNotes.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit;padding-left:12px"><span style="color:var(--warn);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Ideas</span></span><span class="t-meta">9</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a><a href="PhoneNotes.dc.html" class="task" style="min-height:52px;text-decoration:none;color:inherit;padding-left:12px"><span style="color:var(--brand-navy);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg></span><span class="task-body"><span class="t-body-strong" style="font-weight:600">Recipes</span></span><span class="t-meta">4</span><span style="color:var(--ink-faint);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a></div></section>
<p class="t-meta enter enter-3" style="font-size:12px">Press and hold to reorder. Swipe left to rename or delete.</p>
</div>
<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}"><div class="scrim" onClick="{{close}}"></div>
<section class="sheet" aria-label="New list" style="padding:0 20px 34px;display:flex;flex-direction:column;gap:16px"><span class="sheet-handle"></span>
<h2 class="t-title3">New list</h2>
<label class="field"><span class="field-label">Name</span><input class="input is-focus" type="text" value="Errands"></label>
<div class="field"><span class="field-label">Colour</span><div role="group" aria-label="Colour" style="display:flex;gap:10px"><sc-for list="{{colors}}" as="c" hint-placeholder-count="6"><button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width:40px;height:40px;border-radius:var(--radius-md);border:2px solid var(--surface);background:{{c.value}};box-shadow:{{c.ring}};cursor:pointer;transition:box-shadow var(--dur-fast),transform var(--dur-base) var(--ease-spring);transform:scale({{c.scale}})"></button></sc-for></div></div>
<div style="display:flex;gap:10px"><button type="button" class="btn btn-secondary btn-xl" style="flex:1" onClick="{{close}}">Cancel</button><button type="button" class="btn btn-primary btn-xl" style="flex:2" onClick="{{close}}">Create list</button></div>
</section></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sheet: true, color: 'blue' }; }
  renderVals() {
    const s = this.state;
    const colors = [['blue', 'Blue', 'var(--brand-blue)'], ['navy', 'Navy', 'var(--brand-navy)'], ['lav', 'Lavender', 'var(--brand-lavender)'], ['orange', 'Orange', 'var(--warn)'], ['green', 'Green', 'var(--success)'], ['grey', 'Grey', 'var(--ink-muted)']].map(([id, label, value]) => ({
      label, value, pressed: s.color === id ? 'true' : 'false', ring: s.color === id ? '0 0 0 2px var(--brand-blue)' : '0 0 0 1px var(--line)', scale: s.color === id ? 1.06 : 1, pick: () => this.setState({ color: id }) }));
    return { sheet: s.sheet, colors, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }) };
  }
}
</script>
</body>
