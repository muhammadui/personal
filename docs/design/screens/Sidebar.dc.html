<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["today", "upcoming", "inbox", "done", "notes", "locked", "trash", "settings"], "default": "today"}, "$preview": {"width": 248, "height": 960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const a = {};
    ['today', 'upcoming', 'inbox', 'done', 'notes', 'locked', 'trash', 'settings'].forEach((k) => { a[k] = active === k ? 'is-active' : ''; });
    return { a };
  }
}
