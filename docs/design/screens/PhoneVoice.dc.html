<!doctype html>
<html lang="en">
<head>

<title>Personal — Voice recording</title>

<body>
<x-dc>
<helmet>

<div class="p-app" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--canvas)">
<div aria-hidden="true" style="padding:60px 20px;display:flex;flex-direction:column;gap:14px"><span class="t-meta">Tuesday, 3 November</span><span class="t-title1">Phase 0 kickoff</span><span style="height:64px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)"></span><span style="height:220px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)"></span></div>

<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="t-title3">Voice note</h2><span class="pill-status {{pillCls}}" style="height:28px">{{status}}</span></div>
<div style="height:96px;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:var(--radius-lg);background:var(--tint-blue)" aria-hidden="true"><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 0ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 40ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:18px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 80ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:22px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 120ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:14px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 160ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:26px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 200ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:18px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 240ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:18px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 280ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:10px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 320ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:22px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 360ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 400ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:10px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 440ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 480ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:30px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 520ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 560ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:26px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 600ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:18px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 640ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 680ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 720ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:10px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 760ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 800ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 840ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 880ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:26px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 920ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 960ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:42px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 1000ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:30px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 1040ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:18px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 1080ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:30px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 1120ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:22px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.2000000000000002s var(--ease-standard) 1160ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.8s var(--ease-standard) 1200ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:26px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 0.9s var(--ease-standard) 1240ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:34px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.0s var(--ease-standard) 1280ms infinite;animation-play-state:{{play}}"></span><span style="width:4px;height:14px;border-radius:var(--radius-xs);background:var(--brand-blue);animation:p-pulse 1.1s var(--ease-standard) 1320ms infinite;animation-play-state:{{play}}"></span></div>
<div style="text-align:center;font:800 40px/44px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums" aria-live="off">{{clock}}</div>
<div style="display:flex;justify-content:center;align-items:center;gap:24px">
<a href="PhoneEditor.dc.html" class="icon-btn icon-btn-lg" aria-label="Discard recording" style="width:56px;height:56px;color:var(--danger)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></a>
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" class="fab" style="margin-top:0;width:76px;height:76px;background:{{recBg}}"><sc-if value="{{recording}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if><sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg></sc-if></button>
<a href="PhoneEditor.dc.html" class="icon-btn icon-btn-lg" aria-label="Stop and save" style="width:56px;height:56px;color:var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></a>
</div>
<p class="t-meta" style="text-align:center;font-size:12px">Saved into the note on this phone. Uploads when you're online.</p>
</section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sec: 42, rec: true }; }
  componentDidMount() { this._i = setInterval(() => { if (this.state.rec) this.setState({ sec: this.state.sec + 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this._i); }
  renderVals() {
    const s = this.state;
    const mm = String(Math.floor(s.sec / 60)).padStart(2, '0'), ss = String(s.sec % 60).padStart(2, '0');
    return {
      clock: mm + ':' + ss, recording: s.rec, paused: !s.rec, play: s.rec ? 'running' : 'paused',
      status: s.rec ? 'Recording' : 'Paused', pillCls: s.rec ? 'pill-warn' : 'pill-ok',
      recBg: s.rec ? 'var(--danger)' : 'var(--brand-blue)', toggleLabel: s.rec ? 'Pause' : 'Resume',
      toggle: () => this.setState({ rec: !this.state.rec })
    };
  }
}
</script>
</body>
</html>
