<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal — Quick add</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/1cb8d936df66fbbe49cf0ac54da2f100">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="p-app" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--canvas)">
<div aria-hidden="true" style="padding:60px 20px;display:flex;flex-direction:column;gap:14px"><span class="t-meta">Tuesday, 3 November</span><span class="t-title1">Today</span><span style="height:64px;border-radius:var(--radius-lg);background:var(--brand-blue)"></span><span style="height:220px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)"></span></div>
<div class="scrim"></div>
<section class="sheet" aria-label="Quick add" style="padding:0 20px 34px;display:flex;flex-direction:column;gap:18px">
<span class="sheet-handle"></span>
<div class="seg" role="group" aria-label="Type"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="2"><button type="button" class="seg-btn {{k.cls}}" onClick="{{k.pick}}">{{k.label}}</button></sc-for></div>
<div style="display:flex;flex-direction:column;gap:8px">
<label class="sr-only" for="qa">What do you need to do?</label>
<div id="qa" style="font:700 22px/32px var(--font-sans);color:var(--ink);min-height:64px">Call the electrician <span style="color:var(--text-accent);background:var(--tint-blue);border-radius:var(--radius-sm);padding:0 4px">tomorrow 4pm</span> <span style="color:var(--warn-ink);background:var(--warn-tint);border-radius:var(--radius-sm);padding:0 4px">#home</span><span style="display:inline-block;width:2px;height:24px;background:var(--brand-blue);vertical-align:-4px;margin-left:2px;animation:p-blink 1s steps(1) infinite"></span></div>
<span class="t-meta fade-in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg> Wed 4 Nov, 4:00 pm · list Home</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><span class="t-label">Remind me</span>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button type="button" class="chip {{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div></div>
<div class="list">
<button type="button" class="task" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit"><span style="color:var(--ink-muted);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></span><span class="task-body"><span class="t-body-strong">Repeat</span></span><span class="t-meta">Never</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button type="button" class="task" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit"><span style="color:var(--ink-muted);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg></span><span class="task-body"><span class="t-body-strong">Priority</span></span><span class="t-meta">None</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
<button type="button" class="task" style="width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit"><span style="color:var(--ink-muted);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"></path></svg></span><span class="task-body"><span class="t-body-strong">Subtasks</span></span><span class="t-meta">Add</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div style="display:flex;gap:10px"><a href="PhoneToday.dc.html" class="btn btn-secondary btn-xl" style="flex:1">Cancel</a><a href="NotifyPermission.dc.html" class="btn btn-primary btn-xl" style="flex:2">Add task</a></div>
<p class="t-meta" style="font-size:12px;text-align:center">Saved on this phone instantly, even offline.</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kind: 'task', chip: '15' }; }
  renderVals() {
    const s = this.state;
    const kinds = [['task', 'Task'], ['note', 'Note']].map(([id, label]) => ({ label, cls: s.kind === id ? 'is-on' : '', pick: () => this.setState({ kind: id }) }));
    const chips = [['at', 'At 4:00 pm'], ['15', '15 min before'], ['60', '1 hour before'], ['custom', 'Custom']].map(([id, label]) => ({ label, cls: s.chip === id ? 'is-on' : '', pressed: s.chip === id ? 'true' : 'false', pick: () => this.setState({ chip: id }) }));
    return { kinds, chips };
  }
}
</script>
</body>
</html>
