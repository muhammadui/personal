<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal — Desktop drawing mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/1cb8d936df66fbbe49cf0ac54da2f100">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="p-app" style="min-height:960px;display:flex;flex-direction:column;background:var(--surface)">
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--line)">
<a href="Editor.dc.html" class="btn btn-ghost" style="padding:0 10px 0 6px;gap:4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Phase 0 kickoff</a><span class="t-meta">Drawing · page 1 of 2</span><span style="flex:1"></span>
<button type="button" class="icon-btn" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button><button type="button" class="icon-btn" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button>
<span class="sync sync-ok" style="margin:0 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"></path><path d="m9 14 2 2 4-4"></path></svg>Saved</span>
<a href="Editor.dc.html" class="btn btn-primary">Done</a>
</header>
<div style="flex:1;position:relative;display:flex;justify-content:center;padding:32px 24px;background:var(--canvas)">
<div role="toolbar" aria-label="Pen tools" class="popover" style="position:absolute;left:24px;top:32px;padding:8px;display:flex;flex-direction:column;gap:6px;width:64px;align-items:center">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="5"><button type="button" class="icon-btn icon-btn-plain icon-btn-lg" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="background:{{t.bg}};color:{{t.fg}}"><sc-if value="{{t.isPen}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg></sc-if><sc-if value="{{t.isPencil}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path><path d="m15 5 4 4"></path></svg></sc-if><sc-if value="{{t.isMarker}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg></sc-if><sc-if value="{{t.isEraser}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7M5 11l9 9"></path></svg></sc-if><sc-if value="{{t.isLasso}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 22a5 5 0 0 1-2-4"></path><path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"></path><path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></sc-if></button></sc-for>
<span class="divider" style="width:36px;margin:4px 0"></span>
<sc-for list="{{colors}}" as="c" hint-placeholder-count="5"><button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width:28px;height:28px;border-radius:var(--radius-full);border:2px solid var(--surface);background:{{c.value}};box-shadow:{{c.ring}};cursor:pointer;transition:box-shadow var(--dur-fast),transform var(--dur-base) var(--ease-spring);transform:scale({{c.scale}})"></button></sc-for>
<span class="divider" style="width:36px;margin:4px 0"></span>
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3"><button type="button" aria-label="{{z.label}}" onClick="{{z.pick}}" style="width:40px;height:32px;border:0;border-radius:var(--radius-md);background:{{z.bg}};display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:{{z.px}}px;height:{{z.px}}px;border-radius:var(--radius-full);background:var(--ink)"></span></button></sc-for>
</div>
<div class="card" style="width:100%;max-width:820px;min-height:820px;position:relative;box-shadow:var(--shadow-md)">
<svg width="100%" height="100%" style="position:absolute;inset:0" aria-hidden="true"><defs><pattern id="dg2" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="var(--line-control)" opacity=".45"></circle></pattern></defs><rect width="100%" height="100%" fill="url(#dg2)"></rect></svg>
<svg viewBox="0 0 820 600" style="position:absolute;left:0;top:0;width:100%" role="img" aria-label="Handwritten architecture sketch: laptop and phone syncing through a server, with notes"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M60 70c10-18 28-20 34-6s-6 22-18 26 26 0 36-12M120 52v46M142 74c8-8 20-6 20 8s-12 18-20 8M176 64c0 22 0 32 2 34m-2-26c10-10 22-8 24 2" stroke="var(--ink)" stroke-width="3"></path>
<path d="M56 116c90 6 180 2 280-6" stroke="var(--brand-blue)" stroke-width="2.6"></path>
<rect x="80" y="200" width="170" height="110" rx="10" stroke="var(--ink)" stroke-width="2.8"></rect><path d="M64 330h202" stroke="var(--ink)" stroke-width="2.8"></path>
<path d="M330 250c0-34 26-54 60-54 24 0 44 12 52 32 26 0 46 18 46 40s-18 36-42 36h-84c-20 0-32-14-32-36z" stroke="var(--ink)" stroke-width="2.8"></path>
<rect x="590" y="180" width="100" height="160" rx="14" stroke="var(--ink)" stroke-width="2.8"></rect>
<path d="M258 256c22-8 46-8 68-2M316 246l12 8-12 8M492 262c30 0 60-2 90-8M572 246l12 8-14 6" stroke="var(--brand-blue)" stroke-width="2.8"></path>
<path d="M120 400c40-4 90-4 150 0M120 440c60-2 130-2 200 2M120 480c30-2 60-2 90 0" stroke="var(--ink)" stroke-width="2.4"></path>
<path d="M114 440c70 0 140 0 210 2" stroke="var(--warn)" stroke-width="16" opacity=".26"></path>
<path d="M560 420c30-26 90-26 120 0s10 90-50 96-100-30-84-70" stroke="var(--success)" stroke-width="2.8"></path><path d="M600 470l14 12 28-34" stroke="var(--success)" stroke-width="3.2"></path>
</g></svg>
<div style="position:absolute;left:96px;top:520px;width:320px;height:120px;border:1.5px dashed var(--brand-blue);border-radius:var(--radius-md);background:rgba(54,64,219,.04)" aria-hidden="true"></div>
<div class="popover" style="position:absolute;left:96px;top:650px;display:flex;gap:2px;padding:4px"><button type="button" class="btn btn-ghost btn-sm">Convert to text</button><button type="button" class="btn btn-ghost btn-sm">Copy</button><button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger)">Delete</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tool: 'lasso', color: 'ink', size: 2 }; }
  renderVals() {
    const s = this.state;
    const tools = [['pen', 'Pen'], ['pencil', 'Pencil'], ['marker', 'Highlighter'], ['eraser', 'Eraser'], ['lasso', 'Lasso select']].map(([id, label]) => ({
      label, pressed: s.tool === id ? 'true' : 'false', bg: s.tool === id ? 'var(--tint-blue)' : 'transparent', fg: s.tool === id ? 'var(--text-accent)' : 'var(--ink-secondary)',
      isPen: id === 'pen', isPencil: id === 'pencil', isMarker: id === 'marker', isEraser: id === 'eraser', isLasso: id === 'lasso', pick: () => this.setState({ tool: id }) }));
    const colors = [['ink', 'Ink', 'var(--ink)'], ['blue', 'Blue', 'var(--brand-blue)'], ['warn', 'Orange', 'var(--warn)'], ['green', 'Green', 'var(--success)'], ['red', 'Red', 'var(--danger)']].map(([id, label, value]) => ({
      label, value, pressed: s.color === id ? 'true' : 'false', ring: s.color === id ? '0 0 0 2px var(--brand-blue)' : '0 0 0 1px var(--line)', scale: s.color === id ? 1.1 : 1, pick: () => this.setState({ color: id }) }));
    const sizes = [[1, 'Thin', 4], [2, 'Medium', 8], [3, 'Thick', 12]].map(([id, label, px]) => ({ label, px, bg: s.size === id ? 'var(--surface-sunken)' : 'transparent', pick: () => this.setState({ size: id }) }));
    return { tools, colors, sizes };
  }
}
</script>
</body>
</html>
