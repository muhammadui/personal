<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal — Repeat picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/1cb8d936df66fbbe49cf0ac54da2f100">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="p-app" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--canvas)">
<div aria-hidden="true" style="padding:60px 20px;display:flex;flex-direction:column;gap:14px"><span class="t-meta">Tuesday, 3 November</span><span class="t-title1">Today</span><span style="height:64px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)"></span><span style="height:220px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line)"></span></div>
<div class="scrim"></div>
<section class="sheet" style="padding:0 20px 34px;display:flex;flex-direction:column;gap:16px"><span class="sheet-handle"></span>
<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="t-title3">Repeat</h2><a href="PhoneTask.dc.html" class="btn btn-ghost btn-sm" style="color:var(--text-accent)">Done</a></div>
<div class="list"><sc-for list="{{opts}}" as="o" hint-placeholder-count="6"><button type="button" class="task" onClick="{{o.pick}}" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:left;min-height:50px"><span class="task-body"><span class="t-body-strong" style="font-weight:600">{{o.label}}</span></span><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span style="color:var(--text-accent);display:flex" class="fade-in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if></button></sc-for></div>
<sc-if value="{{weekly}}" hint-placeholder-val="{{true}}"><div class="fade-in" style="display:flex;flex-direction:column;gap:8px"><span class="t-label">On these days</span><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" class="chip {{d.cls}}" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="padding:0;justify-content:center;height:40px">{{d.label}}</button></sc-for></div></div></sc-if>
<div class="banner banner-info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg><span>{{summary}}</span></div>
</section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'weekly', days: { T: true } }; }
  renderVals() {
    const s = this.state;
    const opts = [['never', 'Never'], ['daily', 'Every day'], ['weekdays', 'Weekdays'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['custom', 'Every N days']]
      .map(([id, label]) => ({ label, on: s.mode === id, pick: () => this.setState({ mode: id }) }));
    const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const keys = ['M', 'T', 'W', 'Th', 'F', 'Sa', 'Su'];
    const days = keys.map((k, i) => ({ label: names[i].slice(0, 2), cls: s.days[k] ? 'is-on' : '', pressed: s.days[k] ? 'true' : 'false', pick: () => this.setState({ days: { ...this.state.days, [k]: !this.state.days[k] } }) }));
    const chosen = keys.map((k, i) => (s.days[k] ? names[i] : null)).filter(Boolean);
    const summaries = { never: 'Happens once.', daily: 'Every day at the same time.', weekdays: 'Monday to Friday.', monthly: 'Every month on the 3rd.', custom: 'Every 3 days.' };
    return { opts, days, weekly: s.mode === 'weekly', summary: s.mode === 'weekly' ? 'Every ' + (chosen.join(', ') || 'week') + '. The next one appears when you tick this one.' : summaries[s.mode] };
  }
}
</script>
</body>
</html>
